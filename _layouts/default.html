<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Ethan Keller</title>
  <link rel="stylesheet" href="/main.css">
</head>
<body>

</body>
</html>
