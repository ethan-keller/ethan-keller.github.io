<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {%- assign desc = page.description | default: site.description %}
  <meta name="description" content="{{ desc | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ desc | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | default: site.image | absolute_url }}">
  <meta name="twitter:card" content="{% if page.image %}summary_large_image{% else %}summary{% endif %}">
  <link rel="stylesheet" href="/main.css">
</head>
<body>
  {% if page.url != "/" %}<p class="path"><a href="/">ethankeller.ai</a> / {% if page.layout == "post" %}<a href="/blog/">blog</a>{% else %}blog{% endif %}</p>{% endif %}
  {{ content }}
  <footer>© {{ 'now' | date: "%Y" }} {{ site.title }}</footer>
</body>
</html>
