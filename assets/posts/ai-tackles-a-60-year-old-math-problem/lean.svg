<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-label="Diagram in two zones. In a grey zone marked not trusted, a search produces certificates. In a blue zone marked checked by Lean, a check of the certificates and a proof that they imply the bounds together give the theorem 0.239 ≤ α ≤ 0.24633…" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#6b6862"/></marker></defs>
<rect width="1000" height="280" fill="#fffefc"/>
<rect x="400" y="14" width="586" height="252" rx="16" fill="#e3ebf5"/>
<text x="693.0" y="248.0" font-size="19" fill="#1f5fa8" text-anchor="middle" font-weight="600">checked by Lean</text>
<rect x="6" y="14" width="378" height="252" rx="16" fill="#eceae4"/>
<text x="195.0" y="248.0" font-size="19" fill="#6b6862" text-anchor="middle" font-weight="600">not trusted</text>
