<rect x="692" y="95.0" width="286" height="60" rx="10" fill="#fffefc" stroke="#c9c4b8" stroke-width="1.5"/>
<text x="835.0" y="132.0" font-size="21" fill="#1f1e1c" text-anchor="middle" font-weight="600">0.239 ≤ α ≤ 0.24633…</text>
<path d="M676 125 L688 125" stroke="#6b6862" stroke-width="2" fill="none" marker-end="url(#head)"/>
</svg>
