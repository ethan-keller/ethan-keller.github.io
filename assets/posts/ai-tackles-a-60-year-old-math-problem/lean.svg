<text x="95.0" y="132.0" font-size="21" fill="#1f1e1c" text-anchor="middle" font-weight="600">Search</text>
<rect x="200" y="95.0" width="160" height="60" rx="10" fill="#fffefc" stroke="#c9c4b8" stroke-width="1.5"/>
<text x="280.0" y="132.0" font-size="21" fill="#1f1e1c" text-anchor="middle" font-weight="600">Certificates</text>
<path d="M160 125 L196 125" stroke="#6b6862" stroke-width="2" fill="none" marker-end="url(#head)"/>
<rect x="422" y="38" width="230" height="60" rx="10" fill="#fffefc" stroke="#c9c4b8" stroke-width="1.5"/>
<text x="537.0" y="75.0" font-size="21" fill="#1f1e1c" text-anchor="middle" font-weight="600">Certificate check</text>
<rect x="422" y="152" width="230" height="60" rx="10" fill="#fffefc" stroke="#c9c4b8" stroke-width="1.5"/>
<text x="537.0" y="189.0" font-size="21" fill="#1f1e1c" text-anchor="middle" font-weight="600">Implies the bounds</text>
<text x="537.0" y="134.0" font-size="26" fill="#6b6862" text-anchor="middle" font-weight="600">+</text>
